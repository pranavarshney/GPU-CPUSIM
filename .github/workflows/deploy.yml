name: Build Offline HTML & Deploy Pages

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'play-offline.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install & Build Standalone HTML
        run: |
          npm install --legacy-peer-deps
          npm run build:standalone

      - name: Commit play-offline.html to Repo
        run: |
          cp dist/index.html play-offline.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-offline.html
          git diff --cached --quiet || (git commit -m "chore: update standalone play-offline.html" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
